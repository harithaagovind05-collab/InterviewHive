<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>InterviewHive | Practice</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<canvas id="signalField" style="position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.55;"></canvas>

<nav class="navbar">
  <a href="index.html" class="nav-logo">Interview<span>Hive</span></a>
  <ul class="nav-links"><li><a href="practice.html">Practice</a></li><li><a href="interview.html">AI Interview</a></li></ul>
</nav>

<section style="position:relative">
  <div class="glow" style="width:400px;height:400px;background:radial-gradient(circle,rgba(34,211,238,0.12),transparent 70%);top:0;left:-10%"></div>
  <div style="max-width:1000px;margin:0 auto;position:relative;z-index:1">
    <h1>Practice Problems</h1>
    <p style="color:var(--text-secondary);margin-top:6px">Select a challenge to sharpen your skills.</p>
    <div style="margin-top:28px;display:flex;gap:12px;flex-wrap:wrap">
      <input type="text" id="searchInput" placeholder="Search problems..." style="background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:999px;padding:10px 18px;color:var(--text);font-family:inherit;outline:none">
      <select id="difficulty-filter" style="background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:999px;padding:10px 18px;color:var(--text);font-family:inherit;outline:none">
        <option value="All">All</option><option value="Easy">Easy</option><option value="Medium">Medium</option><option value="Hard">Hard</option>
      </select>
    </div>
    <div style="margin-top:32px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px">
      <a href="problem.html" class="card" style="text-decoration:none;color:inherit"><h3>Two Sum</h3><p style="font-size:0.85rem;color:var(--text-secondary);margin-top:6px">Topic: Arrays</p><span style="display:inline-block;margin-top:14px;padding:4px 10px;border-radius:999px;background:rgba(34,211,238,0.1);color:var(--cyan);font-size:0.75rem;font-weight:600">Easy</span></a>
      <a href="problem.html" class="card" style="text-decoration:none;color:inherit"><h3>Valid Parentheses</h3><p style="font-size:0.85rem;color:var(--text-secondary);margin-top:6px">Topic: Stack</p><span style="display:inline-block;margin-top:14px;padding:4px 10px;border-radius:999px;background:rgba(34,211,238,0.1);color:var(--cyan);font-size:0.75rem;font-weight:600">Easy</span></a>
      <a href="problem.html" class="card" style="text-decoration:none;color:inherit"><h3>Merge Intervals</h3><p style="font-size:0.85rem;color:var(--text-secondary);margin-top:6px">Topic: Arrays</p><span style="display:inline-block;margin-top:14px;padding:4px 10px;border-radius:999px;background:rgba(251,191,36,0.15);color:#fbbf24;font-size:0.75rem;font-weight:600">Medium</span></a>
      <a href="problem.html" class="card" style="text-decoration:none;color:inherit"><h3>Binary Tree Level Order Traversal</h3><p style="font-size:0.85rem;color:var(--text-secondary);margin-top:6px">Topic: Trees</p><span style="display:inline-block;margin-top:14px;padding:4px 10px;border-radius:999px;background:rgba(251,191,36,0.15);color:#fbbf24;font-size:0.75rem;font-weight:600">Medium</span></a>
    </div>
  </div>
</section>
<script src="js/practice.js"></script>
<script>
(function(){
  const c=document.getElementById('signalField'); if(!c) return; const x=c.getContext('2d'); let w,h,p=[],m={x:-1000,y:-1000}; const r=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight;} resize(); window.addEventListener('resize',resize);
  document.addEventListener('mousemove',e=>{m.x=e.clientX;m.y=e.clientY;},{passive:true}); document.addEventListener('mouseleave',()=>{m.x=-1000;m.y=-1000;});
  for(let i=0;i<35;i++)p.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-0.5)*0.15,vy:(Math.random()-0.5)*0.15,r:1+Math.random()*1.5});
  function d(){ if(r){x.clearRect(0,0,w,h);requestAnimationFrame(d);return;} x.clearRect(0,0,w,h);
    const gx=m.x>-500?m.x:w*0.65, gy=m.y>-500?m.y:h*0.35; const gr=x.createRadialGradient(gx,gy,0,gx,gy,320); gr.addColorStop(0,'rgba(255,255,255,0.02)'); gr.addColorStop(0.4,'rgba(34,211,238,0.015)'); gr.addColorStop(1,'transparent'); x.fillStyle=gr; x.fillRect(0,0,w,h);
    for(let i=0;i<p.length;i++){ const pt=p[i]; if(!r&&m.x>-500){ const dx=m.x-pt.x, dy=m.y-pt.y, dist=Math.sqrt(dx*dx+dy*dy); if(dist<170){pt.vx+=(dx/dist)*0.003; pt.vy+=(dy/dist)*0.003;} pt.vx*=0.98; pt.vy*=0.98; } pt.x+=pt.vx; pt.y+=pt.vy; if(pt.x<0||pt.x>w)pt.vx*=-0.5; if(pt.y<0||pt.y>h)pt.vy*=-0.5;
    x.beginPath(); x.arc(pt.x,pt.y,pt.r,0,Math.PI*2); x.fillStyle='rgba(255,255,255,0.2)'; x.fill(); }
    for(let i=0;i<p.length;i++) for(let j=i+1;j<p.length;j++){ const dx=p[i].x-p[j].x, dy=p[i].y-p[j].y, dist=Math.sqrt(dx*dx+dy*dy); if(dist<100){x.beginPath();x.moveTo(p[i].x,p[i].y);x.lineTo(p[j].x,p[j].y);x.strokeStyle='rgba(255,255,255,0.06)';x.lineWidth=0.5;x.stroke();}}
    requestAnimationFrame(d); } d();
})();
</script>
</body>
</html>
