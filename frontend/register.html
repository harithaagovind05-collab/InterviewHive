<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register | InterviewHive</title><link rel="stylesheet" href="css/style.css"></head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 6vw">
<div class="glow" style="width:500px;height:500px;background:radial-gradient(circle,rgba(34,211,238,0.15),transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);position:absolute"></div>
<div class="card" style="max-width:420px;width:100%;position:relative;z-index:1">
  <h2>Create Account</h2>
  <p style="color:var(--text-secondary);font-size:0.9rem;margin-top:4px">Start preparing today.</p>
  <form onsubmit="event.preventDefault();" style="margin-top:24px;display:flex;flex-direction:column;gap:18px">
    <label style="font-size:0.85rem;color:var(--text-secondary)">Full Name<input type="text" placeholder="Harithaa" style="width:100%;margin-top:6px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:12px;padding:12px;color:var(--text);font-family:inherit;outline:none"></label>
    <label style="font-size:0.85rem;color:var(--text-secondary)">Email<input type="email" placeholder="your@email.com" style="width:100%;margin-top:6px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:12px;padding:12px;color:var(--text);font-family:inherit;outline:none"></label>
    <label style="font-size:0.85rem;color:var(--text-secondary)">Password<input type="password" placeholder="••••••" style="width:100%;margin-top:6px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:12px;padding:12px;color:var(--text);font-family:inherit;outline:none"></label>
    <button class="btn btn-primary" style="margin-top:4px">Create Account</button>
  </form>
  <p style="margin-top:18px;font-size:0.85rem;color:var(--text-secondary)">Have an account? <a href="login.html" style="color:var(--cyan);text-decoration:none">Login</a></p>
</div>
<script>
(function(){
  const c=document.getElementById('signalField'); if(!c) return; const x=c.getContext('2d'); let w,h,p=[],m={x:-1000,y:-1000}; const r=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight;} resize(); window.addEventListener('resize',resize);
  document.addEventListener('mousemove',e=>{m.x=e.clientX;m.y=e.clientY;},{passive:true}); document.addEventListener('mouseleave',()=>{m.x=-1000;m.y=-1000;});
  for(let i=0;i<35;i++)p.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-0.5)*0.15,vy:(Math.random()-0.5)*0.15,r:1+Math.random()*1.5});
  function d(){ if(r){x.clearRect(0,0,w,h);requestAnimationFrame(d);return;} x.clearRect(0,0,w,h);
    const gx=m.x>-500?m.x:w*0.65, gy=m.y>-500?m.y:h*0.35; const gr=x.createRadialGradient(gx,gy,0,gx,gy,320); gr.addColorStop(0,'rgba(255,255,255,0.02)'); gr.addColorStop(0.4,'rgba(34,211,238,0.015)'); gr.addColorStop(1,'transparent'); x.fillStyle=gr; x.fillRect(0,0,w,h);
    for(let i=0;i<p.length;i++){ const pt=p[i]; if(!r&&m.x>-500){ const dx=m.x-pt.x, dy=m.y-pt.y, dist=Math.sqrt(dx*dx+dy*dy); if(dist<170){pt.vx+=(dx/dist)*0.003; pt.vy+=(dy/dist)*0.003;} pt.vx*=0.98; pt.vy*=0.98; } pt.x+=pt.vx; pt.y+=pt.vy; if(pt.x<0||pt.x>w)pt.vx*=-0.5; if(pt.y<0||pt.y>h)pt.vy*=-0.5;
    x.beginPath(); x.arc(pt.x,pt.y,pt.r,0,Math.PI*2); x.fillStyle='rgba(255,255,255,0.2)'; x.fill(); }
    for(let i=0;i<p.length;i++) for(let j=i+1;j<p.length;j++){ const dx=p[i].x-p[j].x, dy=p[i].y-p[j].y, dist=Math.sqrt(dx*dx+dy*dy); if(dist<100){x.beginPath();x.moveTo(p[i].x,p[i].y);x.lineTo(p[j].x,p[j].y);x.strokeStyle='rgba(255,255,255,0.06)';x.lineWidth=0.5;x.stroke();}}
    requestAnimationFrame(d); } d();
})();
</script>
</body>
</html>
