<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>InterviewHive | AI Interview Setup</title><link rel="stylesheet" href="css/style.css"></head>
<body>

<nav class="navbar">
  <a href="index.html" class="nav-logo">InterviewHive</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="dashboard.html">Dashboard</a></li>
    <li><a href="practice.html">Practice</a></li>
    <li><a href="interview.html">AI Interview</a></li>
  </ul>
  <a href="dashboard.html" class="btn btn-primary" style="font-size:0.8rem;padding:10px 20px;">Dashboard →</a>
</nav>

<header style="position:relative;min-height:100vh;overflow:hidden;padding:160px 6vw 120px;">
  <canvas id="signalField" style="position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0.7;"></canvas>
  <div style="position:absolute;inset:0;pointer-events:none;z-index:0;">
    <div style="position:absolute;width:700px;height:700px;top:-20%;left:-15%;background:radial-gradient(circle at 40% 30%,rgba(255,255,255,0.06),transparent 60%),radial-gradient(circle at 70% 60%,rgba(34,211,238,0.12),transparent 55%);filter:blur(110px);opacity:0.9;"></div>
    <div style="position:absolute;width:500px;height:500px;bottom:-15%;right:-10%;background:radial-gradient(circle,rgba(255,255,255,0.04),transparent 60%);filter:blur(100px);opacity:0.7;"></div>
  </div>

  <div style="max-width:1500px;margin:0 auto;position:relative;z-index:1;display:grid;grid-template-columns:1.1fr 1fr;gap:14vw;align-items:start;">
    <div>
      <p style="font-family:var(--font-display);font-size:0.75rem;letter-spacing:0.14em;color:rgba(255,255,255,0.3);margin-bottom:28px;">INTERVIEW SETUP</p>
      <h1 style="font-family:var(--font-display);font-weight:700;letter-spacing:-0.06em;line-height:0.9;font-size:clamp(3.5rem,9vw,8rem);color:#fff;text-wrap:balance;">Your interview.<br>Your rules.</h1>
      <p style="margin-top:32px;font-size:1.05rem;color:rgba(255,255,255,0.55);line-height:1.65;max-width:460px;">Configure language, difficulty and scope. The session adapts from the first question.</p>
    </div>

    <form id="interview-form" style="position:relative;z-index:1;">
      <div style="border-top:1px solid rgba(255,255,255,0.1);padding-top:32px;display:flex;flex-direction:column;gap:36px;">
        <div>
          <label for="language" style="font-family:var(--font-display);font-size:0.7rem;letter-spacing:0.12em;color:rgba(255,255,255,0.25);display:block;margin-bottom:14px;">LANGUAGE</label>
          <select id="language" style="width:100%;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:16px 18px;color:#fff;font-family:inherit;font-size:1rem;outline:none;appearance:none;cursor:pointer;">
            <option>Java</option><option>Python</option><option>C++</option>
          </select>
        </div>
        <div>
          <label for="difficulty" style="font-family:var(--font-display);font-size:0.7rem;letter-spacing:0.12em;color:rgba(255,255,255,0.25);display:block;margin-bottom:14px;">DIFFICULTY</label>
          <select id="difficulty" style="width:100%;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:16px 18px;color:#fff;font-family:inherit;font-size:1rem;outline:none;appearance:none;cursor:pointer;">
            <option>Easy</option><option>Medium</option><option>Hard</option>
          </select>
        </div>
        <div>
          <label for="questions" style="font-family:var(--font-display);font-size:0.7rem;letter-spacing:0.12em;color:rgba(255,255,255,0.25);display:block;margin-bottom:14px;">QUESTIONS</label>
          <select id="questions" style="width:100%;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:16px 18px;color:#fff;font-family:inherit;font-size:1rem;outline:none;appearance:none;cursor:pointer;">
            <option>3</option><option>5</option><option>8</option>
          </select>
        </div>
      </div>

      <div style="margin-top:48px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;padding-top:28px;border-top:1px solid rgba(255,255,255,0.08);">
        <div style="font-size:0.8rem;color:rgba(255,255,255,0.35);line-height:1.4;">Estimated duration: ~15 min</div>
        <button type="submit" class="btn btn-primary" style="font-size:1.05rem;padding:16px 32px;">Start AI Interview →</button>
      </div>
    </form>
  </div>
</header>
<script>
(function(){
  const canvas = document.getElementById('signalField');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let w, h, particles = [], mouse = {x:-1000,y:-1000};
  const isReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize(){ w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  document.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; }, {passive:true});
  document.addEventListener('mouseleave', () => { mouse.x = -1000; mouse.y = -1000; });
  for(let i=0;i<40;i++){
    particles.push({x:Math.random()*w, y:Math.random()*h, vx:(Math.random()-0.5)*0.15, vy:(Math.random()-0.5)*0.15, r:1+Math.random()*1.5});
  }
  function draw(){
    if(isReduced){ ctx.clearRect(0,0,w,h); requestAnimationFrame(draw); return; }
    ctx.clearRect(0,0,w,h);
    const gx = mouse.x > -500 ? mouse.x : w*0.6;
    const gy = mouse.y > -500 ? mouse.y : h*0.4;
    const grad = ctx.createRadialGradient(gx, gy, 0, gx, gy, 300);
    grad.addColorStop(0, 'rgba(255,255,255,0.025)');
    grad.addColorStop(0.5, 'rgba(34,211,238,0.02)');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);
    for(let i=0;i<particles.length;i++){
      const p = particles[i];
      if(!isReduced && mouse.x > -500){ const dx=mouse.x-p.x, dy=mouse.y-p.y, dist=Math.sqrt(dx*dx+dy*dy); if(dist<180){ p.vx+=(dx/dist)*0.003; p.vy+=(dy/dist)*0.003; } p.vx*=0.98; p.vy*=0.98; }
      p.x += p.vx; p.y += p.vy; if(p.x<0||p.x>w) p.vx*=-0.5; if(p.y<0||p.y>h) p.vy*=-0.5;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,0.22)'; ctx.fill();
    }
    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y, d=Math.sqrt(dx*dx+dy*dy);
        if(d<110){ ctx.beginPath(); ctx.moveTo(particles[i].x,particles[i].y); ctx.lineTo(particles[j].x,particles[j].y); ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=0.5; ctx.stroke(); }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
<script>
(function(){
  const c=document.getElementById('signalField'); if(!c) return; const x=c.getContext('2d'); let w,h,p=[],m={x:-1000,y:-1000}; const r=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight;} resize(); window.addEventListener('resize',resize);
  document.addEventListener('mousemove',e=>{m.x=e.clientX;m.y=e.clientY;},{passive:true}); document.addEventListener('mouseleave',()=>{m.x=-1000;m.y=-1000;});
  for(let i=0;i<35;i++)p.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-0.5)*0.15,vy:(Math.random()-0.5)*0.15,r:1+Math.random()*1.5});
  function d(){ if(r){x.clearRect(0,0,w,h);requestAnimationFrame(d);return;} x.clearRect(0,0,w,h);
    const gx=m.x>-500?m.x:w*0.65, gy=m.y>-500?m.y:h*0.35; const gr=x.createRadialGradient(gx,gy,0,gx,gy,320); gr.addColorStop(0,'rgba(255,255,255,0.02)'); gr.addColorStop(0.4,'rgba(34,211,238,0.015)'); gr.addColorStop(1,'transparent'); x.fillStyle=gr; x.fillRect(0,0,w,h);
    for(let i=0;i<p.length;i++){ const pt=p[i]; if(!r&&m.x>-500){ const dx=m.x-pt.x, dy=m.y-pt.y, dist=Math.sqrt(dx*dx+dy*dy); if(dist<170){pt.vx+=(dx/dist)*0.003; pt.vy+=(dy/dist)*0.003;} pt.vx*=0.98; pt.vy*=0.98; } pt.x+=pt.vx; pt.y+=pt.vy; if(pt.x<0||pt.x>w)pt.vx*=-0.5; if(pt.y<0||pt.y>h)pt.vy*=-0.5;
    x.beginPath(); x.arc(pt.x,pt.y,pt.r,0,Math.PI*2); x.fillStyle='rgba(255,255,255,0.2)'; x.fill(); }
    for(let i=0;i<p.length;i++) for(let j=i+1;j<p.length;j++){ const dx=p[i].x-p[j].x, dy=p[i].y-p[j].y, dist=Math.sqrt(dx*dx+dy*dy); if(dist<100){x.beginPath();x.moveTo(p[i].x,p[i].y);x.lineTo(p[j].x,p[j].y);x.strokeStyle='rgba(255,255,255,0.06)';x.lineWidth=0.5;x.stroke();}}
    requestAnimationFrame(d); } d();
})();
</script>
<script>
document.getElementById('interview-form').addEventListener('submit', async function(e){
  e.preventDefault();
  const language = document.getElementById('language').value;
  const difficulty = document.getElementById('difficulty').value;
  const questions = document.getElementById('questions').value;
  try {
    const res = await fetch('http://localhost:8000/api/interview/start', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({language,difficulty,number_of_questions: parseInt(questions)})
    });
    const data = await res.json();
    if(data.session_id) window.location.href = 'interview-session.html?sid=' + data.session_id;
    else alert('Failed to start interview: ' + (data.error || 'unknown'));
  } catch(err){ alert('Cannot connect to server.'); }
});
</script>
</body>
</html>
