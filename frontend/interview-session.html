<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>InterviewHive | Interview Session</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<canvas id="signalField" style="position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.55;"></canvas>

<nav class="navbar">
  <a href="index.html" class="nav-logo">Interview<span>Hive</span></a>
  <ul class="nav-links"><li><a href="dashboard.html">Dashboard</a></li><li><a href="interview.html">AI Interview</a></li></ul>
</nav>

<section style="position:relative;min-height:92vh;padding-top:100px">
  <div style="max-width:800px;margin:0 auto;position:relative;z-index:1;padding:0 6vw">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h2 style="font-size:1rem;font-weight:600;color:var(--cyan)">AI Mock Interview</h2>
      <span style="font-size:0.85rem;color:var(--text-secondary)">Question <span id="question-number">1</span> of 5</span>
    </div>

    <div style="background:linear-gradient(to right,rgba(34,211,238,0.4),rgba(34,211,238,0.05));height:6px;border-radius:999px;margin-bottom:32px"><div id="progress-fill" style="width:20%;height:100%;background:var(--cyan);border-radius:999px;box-shadow:0 0 12px rgba(34,211,238,0.45)"></div></div>

    <div class="card" style="margin-bottom:24px;border-left:3px solid var(--cyan)">
      <h2 id="question-title" style="font-size:1.6rem;margin-bottom:8px">Reverse an Array</h2>
      <p id="question-description" style="color:var(--text-secondary)">Write a Java program to reverse an array without using any built-in reverse method.</p>
    </div>

    <div class="card">
      <h3 style="margin-bottom:10px;font-size:0.9rem;color:var(--text-secondary)">Your Answer</h3>
      <textarea id="answer" placeholder="Write your answer here..." rows="10" style="width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:14px;padding:16px;color:var(--text);font-family:inherit;font-size:0.95rem;outline:none;resize:vertical"></textarea>
      <div style="margin-top:20px;display:flex;gap:12px">
        <button id="submit-btn" class="btn btn-secondary">Submit Answer</button>
        <button id="next-btn" class="btn btn-primary">Next Question →</button>
      </div>
    </div>
  </div>
</section>

<script src="js/interview-session.js"></script>
<script>
(function(){
  const c=document.getElementById('signalField'); if(!c) return; const x=c.getContext('2d'); let w,h,p=[],m={x:-1000,y:-1000}; const r=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight;} resize(); window.addEventListener('resize',resize);
  document.addEventListener('mousemove',e=>{m.x=e.clientX;m.y=e.clientY;},{passive:true}); document.addEventListener('mouseleave',()=>{m.x=-1000;m.y=-1000;});
  for(let i=0;i<35;i++)p.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-0.5)*0.15,vy:(Math.random()-0.5)*0.15,r:1+Math.random()*1.5});
  function d(){ if(r){x.clearRect(0,0,w,h);requestAnimationFrame(d);return;} x.clearRect(0,0,w,h);
    const gx=m.x>-500?m.x:w*0.65, gy=m.y>-500?m.y:h*0.35; const gr=x.createRadialGradient(gx,gy,0,gx,gy,320); gr.addColorStop(0,'rgba(255,255,255,0.02)'); gr.addColorStop(0.4,'rgba(34,211,238,0.015)'); gr.addColorStop(1,'transparent'); x.fillStyle=gr; x.fillRect(0,0,w,h);
    for(let i=0;i<p.length;i++){ const pt=p[i]; if(!r&&m.x>-500){ const dx=m.x-pt.x, dy=m.y-pt.y, dist=Math.sqrt(dx*dx+dy*dy); if(dist<170){pt.vx+=(dx/dist)*0.003; pt.vy+=(dy/dist)*0.003;} pt.vx*=0.98; pt.vy*=0.98; } pt.x+=pt.vx; pt.y+=pt.vy; if(pt.x<0||pt.x>w)pt.vx*=-0.5; if(pt.y<0||pt.y>h)pt.vy*=-0.5;
    x.beginPath(); x.arc(pt.x,pt.y,pt.r,0,Math.PI*2); x.fillStyle='rgba(255,255,255,0.2)'; x.fill(); }
    for(let i=0;i<p.length;i++) for(let j=i+1;j<p.length;j++){ const dx=p[i].x-p[j].x, dy=p[i].y-p[j].y, dist=Math.sqrt(dx*dx+dy*dy); if(dist<100){x.beginPath();x.moveTo(p[i].x,p[i].y);x.lineTo(p[j].x,p[j].y);x.strokeStyle='rgba(255,255,255,0.06)';x.lineWidth=0.5;x.stroke();}}
    requestAnimationFrame(d); } d();
})();
</script>
</body>
</html>
